
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - MyBlog</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">
    <a href="index.html" class="logo">My<span>Blog.</span></a>

    <nav>
        <a href="index.html">Home</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="createblog.html">Create Blog</a>
        <a href="login.html" id="logoutBtn">Logout</a>
    </nav>
</header>

<main class="dashboard-section">

    <div class="dashboard-heading">
        <h1>My Dashboard</h1>
        <p>Manage your published blogs here.</p>
    </div>

    <div class="dashboard-stats">
        <div class="stat-card">
            <h2 id="totalBlogs">0</h2>
            <p>Total Blogs</p>
        </div>
    </div>

    <div class="blog-table">
        <h2>My Published Blogs</h2>

        <table>
            <thead>
                <tr>
                    <th>Blog Title</th>
                    <th>Category</th>
                    <th>Date</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="blogTableBody"></tbody>
        </table>
    </div>

    <a href="create-blog.html" class="dashboard-create-btn">
        + Create New Blog
    </a>

</main>

<footer>
    <h2>My<span>Blog.</span></h2>
    <p>Share your thoughts. Inspire the world.</p>
    <p class="copyright">© 2026 MyBlog. All Rights Reserved.</p>
</footer>

<script src="script.js"></script>

</body>
</html>
